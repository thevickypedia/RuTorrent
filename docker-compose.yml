services:
  app:
    image: rutorrent
    container_name: rutorrent
    network_mode: bridge
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ~/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    ports:
      - "${PORT:-3000}:${port:-3000}"
    depends_on:
      - qbittorrent
      - tor
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - WEBUI_PORT=3012
    ports:
      - "3012:3012"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ~/qbittorrent/config:/config
      - ~/Downloads:/downloads
    networks:
      - tor_net
    restart: unless-stopped

  tor:
    image: dperson/torproxy
    container_name: tor
    restart: unless-stopped
    ports:
      - "9050:9050"
      - "9051:9051"
    depends_on:
      - qbittorrent

networks:
  tor_net:
    driver: bridge

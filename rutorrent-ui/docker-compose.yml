services:
  rutorrent-ui:
    image: nginx:alpine
    container_name: rutorrent-ui

    ports:
      - "8080:80"

    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/default.conf:ro

      # Mount source template
      - ../src/templates:/templates:ro

    command: >
      /bin/sh -c "
      cp /templates/index.html /usr/share/nginx/html/index.html &&
      nginx -g 'daemon off;'
      "

    restart: unless-stopped

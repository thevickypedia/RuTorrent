server {
    # Maps internal port (specified in docker-compose.yml)
    listen 80 default_server;
    # Matches ANY server name (should be restricted to example.com in a production use-case)
    server_name _;

    # Set upstream origin
    set $backend_origin http://192.168.1.230:3000;

    # Forward all requests to a remote service
    location / {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
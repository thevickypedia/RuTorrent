<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RuTorrent WebUI</title>
    <meta content="RuTorrent WebUI" property="og:type">
    <meta content="WebUI for RuTorrent API" name="description">
    <meta content="Rust, HTML, CSS, JavaScript, RuTorrent" name="keywords">
    <meta content="Vignesh Rao" name="author">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="https://thevickypedia.github.io/open-source/images/logo/rust.ico" name="favicon" property="og:image"
          rel="icon">
    <link href="https://thevickypedia.github.io/open-source/images/logo/rust.png" name="apple-touch-icon"
          property="og:image"
          rel="apple-touch-icon">
    <meta content="no-cache, no-store, must-revalidate" http-equiv="content-type">
    <meta content="no-cache" http-equiv="refresh">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@700;800&display=swap"
          rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --surface-hi: #18181c;
            --border: #232328;
            --border-hi: #3a3a44;
            --accent: #e8ff47;
            --accent-dim: #b8cc2a;
            --text: #e2e2e6;
            --muted: #6b6b78;
            --error: #ff4f4f;
            --warn: #ffb347;
            --ok: #47ffb3;
            --mono: 'JetBrains Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 4px);
            pointer-events: none;
            z-index: 999;
        }

        /* ── VIEWS ── */
        .view {
            display: none;
        }

        .view.active {
            display: flex;
        }

        /* ══════════════════════════════
           LOGIN VIEW
        ══════════════════════════════ */
        #loginView {
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3rem 2.5rem;
            position: relative;
            animation: fadeUp 0.4s ease both;
        }

        .login-card::before, .login-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--accent);
            border-style: solid;
        }

        .login-card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .login-card::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: var(--display);
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .tagline {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        .field.inline {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.875rem;
            padding: 0.65rem 0.875rem;
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            border-color: var(--accent);
        }

        input::placeholder {
            color: var(--muted);
            opacity: 0.5;
        }

        .error-msg {
            margin-top: 1rem;
            font-size: 0.72rem;
            color: var(--error);
            letter-spacing: 0.05em;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        /* ══════════════════════════════
           DASHBOARD VIEW
        ══════════════════════════════ */
        #dashView {
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .header-logo {
            font-family: var(--display);
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        main {
            padding: 2rem;
            flex: 1;
            overflow-y: auto;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #torrentCount {
            color: var(--accent);
            margin-left: 0.35rem;
        }

        /* Table */
        .torrent-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
        }

        .torrent-table thead tr {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .torrent-table th {
            padding: 0.6rem 1rem;
            text-align: left;
            font-size: 0.62rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 400;
        }

        .torrent-table th:first-child {
            width: 40px;
        }

        .torrent-table tbody tr {
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }

        .torrent-table tbody tr:hover {
            background: var(--surface-hi);
        }

        .torrent-table tbody tr.selected {
            background: rgba(232, 255, 71, 0.05);
            border-color: rgba(232, 255, 71, 0.2);
        }

        .torrent-table td {
            padding: 0.8rem 1rem;
            font-size: 0.8rem;
        }

        .torrent-table td:first-child {
            text-align: center;
        }

        input[type="checkbox"].torrent-check {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-hi);
            background: var(--bg);
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            border-radius: 3px;
        }

        .sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease;
            white-space: nowrap;
        }

        .sortable:hover {
            color: var(--text);
        }

        .sortable.active {
            color: var(--accent);
        }

        .sort-indicator {
            display: inline-block;
            width: 10px;
            margin-left: 0.35rem;
            opacity: 0.5;
        }

        .sortable.active .sort-indicator {
            opacity: 1;
        }

        .sortable.asc .sort-indicator::before {
            content: '↑';
        }

        .sortable.desc .sort-indicator::before {
            content: '↓';
        }

        input[type="checkbox"].torrent-check:checked {
            border-color: var(--accent);
            background: var(--accent);
        }

        input[type="checkbox"].torrent-check:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid #000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .badge {
            display: inline-block;
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border: 1px solid;
        }

        .badge-downloading {
            color: var(--warn);
            border-color: rgba(255, 179, 71, 0.3);
            background: rgba(255, 179, 71, 0.07);
        }

        .badge-copying {
            color: #7eb8ff;
            border-color: rgba(126, 184, 255, 0.3);
            background: rgba(126, 184, 255, 0.07);
        }

        .badge-completed {
            color: var(--ok);
            border-color: rgba(71, 255, 179, 0.3);
            background: rgba(71, 255, 179, 0.07);
        }

        .badge-failed {
            color: var(--error);
            border-color: rgba(255, 79, 79, 0.3);
            background: rgba(255, 79, 79, 0.07);
        }

        .badge-downloaded {
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.3);
            background: rgba(192, 132, 252, 0.07);
        }

        .badge-copy-error {
            color: var(--error);
            border-color: rgba(255, 79, 79, 0.3);
            background: rgba(255, 79, 79, 0.07);
        }

        .retry-icon {
            font-size: 12px;
            line-height: 12px;
            display: inline-block;
        }

        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 79, 79, 0.4);
            background: transparent;
            color: var(--error);
            cursor: pointer;
            margin-left: 0.5rem;
            transition: background 0.15s, border-color 0.15s, transform 0.2s;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .retry-btn:hover {
            background: rgba(255, 79, 79, 0.12);
            border-color: var(--error);
        }

        .retry-btn.spinning svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            padding: 4rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        /* Status bar */
        .status-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 0.4rem 2rem;
            font-size: 0.62rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar .accent {
            color: var(--accent);
        }

        .refresh-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        .refresh-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.65rem;
            color: var(--muted);
        }

        .refresh-select {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.25rem 0.5rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            outline: none;
            cursor: pointer;
        }

        .refresh-select:focus {
            border-color: var(--accent);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ══════════════════════════════
           SHARED: Buttons
        ══════════════════════════════ */
        .btn {
            font-family: var(--mono);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.6rem 1.1rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #0a0a0b;
            border-color: var(--accent);
        }

        .btn-primary:not(:disabled):hover {
            background: var(--accent-dim);
            border-color: var(--accent-dim);
        }

        .btn-primary:not(:disabled):active {
            transform: scale(0.99);
        }

        .btn-danger {
            background: transparent;
            color: var(--error);
            border-color: var(--error);
        }

        .btn-danger:not(:disabled):hover {
            background: rgba(255, 79, 79, 0.1);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border-color: var(--border);
        }

        .btn-ghost:not(:disabled):hover {
            color: var(--text);
            border-color: var(--border-hi);
        }

        /* ══════════════════════════════
           SHARED: Modal
        ══════════════════════════════ */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            animation: modalIn 0.2s ease both;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.97) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }

        .modal-title {
            font-family: var(--display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            line-height: 1;
            padding: 0.2rem;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field-hint {
            font-size: 0.6rem;
            color: var(--muted);
            opacity: 0.6;
            margin-top: 0.25rem;
        }

        .section-divider {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin: 0.25rem 0 0;
            grid-column: 1 / -1;
        }

        .toggle-field {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0;
        }

        .toggle {
            appearance: none;
            width: 32px;
            height: 18px;
            background: var(--border);
            border-radius: 9px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 12px;
            height: 12px;
            background: var(--muted);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }

        .toggle:checked {
            background: rgba(232, 255, 71, 0.2);
        }

        .toggle:checked::after {
            transform: translateX(14px);
            background: var(--accent);
        }

        .toggle-label {
            font-size: 0.75rem;
            color: var(--text);
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 0;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        /* ══════════════════════════════
           SHARED: Toast
        ══════════════════════════════ */
        .toast-area {
            position: fixed;
            bottom: 3rem;
            right: 1.5rem;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 0.75rem 1rem;
            font-size: 0.72rem;
            color: var(--text);
            animation: toastIn 0.2s ease both;
            max-width: 320px;
        }

        .toast.error {
            border-left-color: var(--error);
        }

        .toast.success {
            border-left-color: var(--ok);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ══════════════════════════════
           MOBILE
        ══════════════════════════════ */
        @media (max-width: 768px) {
            html, body {
                font-size: 15px;
            }

            body::before {
                display: none;
            }

            header {
                padding: 1rem;
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .header-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            #deleteBtn {
                grid-column: 1 / -1;
            }

            .btn {
                width: 100%;
                min-height: 44px;
                font-size: 0.78rem;
            }

            main {
                padding: 1rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .torrent-table {
                border: none;
            }

            .torrent-table thead {
                display: table-header-group;
            }

            .torrent-table thead tr {
                display: table;
                width: 100%;
                table-layout: fixed;
                background: transparent;
            }

            .torrent-table th {
                padding: 0.75rem 0.5rem;
                font-size: 0.62rem;
            }

            .sortable {
                cursor: pointer;
            }

            .sortable.active {
                color: var(--accent);
            }

            .sort-indicator {
                margin-left: 0.2rem;
            }

            .torrent-table tbody {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                margin-top: 0.75rem;
            }

            .torrent-table tbody tr {
                display: flex;
                flex-direction: column;
                background: var(--surface);
                border: 1px solid var(--border);
                padding: 1rem;
                border-radius: 10px;
            }

            .torrent-table td {
                border: none;
                padding: 0.3rem 0;
            }

            .torrent-table td:first-child {
                order: -1;
                text-align: left;
                padding-bottom: 0.75rem;
            }

            .torrent-table td:nth-child(2) {
                font-size: 0.9rem;
                word-break: break-word;
                line-height: 1.4;
            }

            .torrent-table td:nth-child(3) {
                padding-top: 0.5rem;
            }

            .status-bar {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
                gap: 0.75rem;
                font-size: 0.65rem;
            }

            .login-card {
                padding: 2rem 1.25rem;
            }

            .modal-backdrop {
                padding: 0;
                align-items: flex-end;
            }

            .modal {
                max-width: 100%;
                width: 100%;
                max-height: 92vh;
                border-radius: 16px 16px 0 0;
                padding: 1.25rem;
                animation: mobileModalIn 0.2s ease both;
            }

            @keyframes mobileModalIn {
                from {
                    transform: translateY(30px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }
            .form-grid {
                grid-template-columns: 1fr;
            }

            input[type="text"],
            input[type="password"],
            input[type="number"] {
                min-height: 46px;
                font-size: 16px;
            }

            .modal-footer {
                flex-direction: column-reverse;
            }

            .toast-area {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
            }

            .toast {
                max-width: unset;
            }
        }
    </style>
</head>
<body>

<!-- ══════════════════════════════
     LOGIN VIEW
══════════════════════════════ -->
<div class="view active" id="loginView">
    <div class="login-card">
        <div class="logo">RuTorrent</div>
        <div class="tagline">WebUI for RuTorrent API</div>

        <div class="field">
            <label for="username">Username</label>
            <input autocomplete="username" id="username" placeholder="user" type="text">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input autocomplete="current-password" id="password" placeholder="••••••••" type="password">
        </div>

        <button class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:2rem;">Authenticate →</button>
        <div class="error-msg" id="loginError">Authentication failed. Check your credentials.</div>
    </div>
</div>

<!-- ══════════════════════════════
     DASHBOARD VIEW
══════════════════════════════ -->
<div class="view" id="dashView">
    <header>
        <div class="header-logo">RuTorrent</div>
        <div class="header-actions">
            <button class="btn btn-danger" disabled id="deleteBtn">Delete Selected</button>
            <button class="btn btn-primary" id="addBtn">+ Add Torrent</button>
            <button class="btn btn-ghost" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <div class="section-title">
                Active Torrents
                <span id="torrentCount">(0)</span>
            </div>
            <div class="refresh-controls">
                <span class="refresh-dot"></span>
                <span>auto-refresh</span>
                <select class="refresh-select" id="refreshInterval">
                    <option value="5000">5s</option>
                    <option value="10000">10s</option>
                    <option value="30000">30s</option>
                    <option value="60000">60s</option>
                    <option value="300000">5m</option>
                </select>
            </div>
        </div>

        <table class="torrent-table">
            <thead>
            <tr>
                <th style="width:44px;">
                    <input id="selectAll" type="checkbox">
                </th>
                <th class="sortable" id="sortName">
                    Name
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" id="sortStatus">
                    Status
                    <span class="sort-indicator"></span>
                </th>
            </tr>
            </thead>
            <tbody id="torrentBody">
            <tr>
                <td class="empty-state" colspan="3">Loading…</td>
            </tr>
            </tbody>
        </table>
    </main>

    <div class="status-bar">
        <div style="display:flex; gap:2rem; align-items:center;">
            <span class="accent">RuTorrent</span>
            <span id="versionText">v—</span>
            <span id="lastUpdated">—</span>
        </div>

        <span id="sessionRemaining">-</span>
    </div>
</div>

<!-- Add Torrent Modal -->
<div class="modal-backdrop" id="addModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Add Torrent</div>
            <button class="modal-close" id="closeModal">✕</button>
        </div>

        <div class="form-grid">
            <div class="field full">
                <label for="f-url">Magnet URL <span style="color:var(--error)">*</span></label>
                <input id="f-url" placeholder="magnet:?xt=urn:btih:…" type="text">
            </div>
            <div class="field full">
                <label for="f-save">Local Save Path</label>
                <input id="f-save" placeholder="Leave blank for default" type="text">
                <div class="field-hint">Overrides the default qBittorrent save path</div>
            </div>

            <div class="section-divider">Remote Transfer (optional)</div>

            <div class="field">
                <label for="f-host">Remote Host</label>
                <input id="f-host" placeholder="192.168.1.100" type="text">
            </div>
            <div class="field">
                <label for="f-user">Remote Username</label>
                <input id="f-user" placeholder="admin" type="text">
            </div>
            <div class="field full">
                <label for="f-path">Remote Path</label>
                <input id="f-path" placeholder="/home/admin/Movies" type="text">
            </div>
            <div class="field full">
                <div class="toggle-field">
                    <input class="toggle" id="f-delete" type="checkbox">
                    <label class="toggle-label" for="f-delete">Delete local files after transfer</label>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelModal">Cancel</button>
            <button class="btn btn-primary" id="submitAdd">Queue Torrent →</button>
        </div>
    </div>
</div>

<!-- Retry Modal -->
<div class="modal-backdrop" id="retryModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="retry-modal-title"></div>
            <button class="modal-close" id="closeRetryModal">&#x2715;</button>
        </div>
        <div class="form-grid">
            <div class="field full">
                <label for="r-name">Torrent</label>
                <input id="r-name" readonly style="opacity:0.5; cursor:default; border-color:var(--border);"
                       type="text">
            </div>
            <div class="field">
                <label for="r-host">Remote Host</label>
                <input id="r-host" placeholder="192.168.1.100" type="text">
            </div>
            <div class="field">
                <label for="r-user">Remote Username</label>
                <input id="r-user" placeholder="admin" type="text">
            </div>
            <div class="field full">
                <label for="r-path">Remote Path</label>
                <input id="r-path" placeholder="/home/admin/Movies" type="text">
            </div>
            <div class="field full">
                <label for="r-timeout">Rsync Timeout</label>
                <input id="r-timeout" max="30" min="1" placeholder="3" type="number">
            </div>
            <div class="field full">
                <div class="toggle-field">
                    <input class="toggle" id="r-delete" type="checkbox">
                    <label class="toggle-label" for="r-delete">Delete local files after transfer</label>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="cancelRetryModal">Cancel</button>
            <button class="btn btn-primary" id="submitRetry">Retry &#x2192;</button>
        </div>
    </div>
</div>

<div class="toast-area" id="toastArea"></div>

<script>
    // ── State ─────────────────────────────────────────────────
    let apikey = sessionStorage.getItem('apikey') || '';
    let selectedNames = new Set();
    let pollTimer = null;
    let refreshInterval = Number(localStorage.getItem('refreshInterval')) || 30000;
    let sessionCountdown = null;
    let sessionExpiresAt = Number(sessionStorage.getItem('sessionExpiresAt')) || 0;
    let sortKey = sessionStorage.getItem('sortKey') || 'status';
    let sortDirection = sessionStorage.getItem('sortDirection') || 'asc';
    const timeout = 3 * 1000;  // 3 seconds timeout
    const sessionExpiry = 30 * 60 * 1000;  // 30 minutes session

    // ── Views ─────────────────────────────────────────────────
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // On load: if we have a stored apikey, go straight to dashboard
    if (apikey) {
        if (!sessionExpiresAt) {
            handleUnauth();
        } else {
            showView('dashView');
            startSessionTimer();
            startDashboard();
        }
    }

    // ── Login ─────────────────────────────────────────────────
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Authenticating…';
        errorMsg.classList.remove('visible');

        try {
            const resp = await fetch('/authenticator', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa(username + ':' + password)
                },
                signal: AbortSignal.timeout(timeout)
            });

            if (resp.ok) {
                const data = await resp.json();
                apikey = data.apikey;
                sessionExpiresAt = Date.now() + (sessionExpiry);
                sessionStorage.setItem('apikey', apikey);
                sessionStorage.setItem('sessionExpiresAt', `${sessionExpiresAt}`);
                startSessionTimer();
                showView('dashView');
                startDashboard();
            } else {
                errorMsg.classList.add('visible');
            }
        } catch {
            errorMsg.textContent = 'Network error. Is the server running?';
            errorMsg.classList.add('visible');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Authenticate →';
        }
    });

    // Allow Enter key on login inputs
    ['username', 'password'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    });

    // ── Dashboard ─────────────────────────────────────────────
    function authHeaders() {
        return {'Content-Type': 'application/json', 'apikey': apikey};
    }

    function startSessionTimer() {
        if (sessionCountdown) {
            clearInterval(sessionCountdown);
            sessionCountdown = null;
        }
        if (!sessionExpiresAt || sessionExpiresAt < Date.now()) {
            handleUnauth();
            return;
        }
        updateSessionRemaining();
        sessionCountdown = setInterval(() => {
            updateSessionRemaining();
            if (Date.now() >= sessionExpiresAt) {
                clearInterval(sessionCountdown);
                sessionCountdown = null;
                handleUnauth();
            }
        }, 1000);
    }

    function updateSessionRemaining() {
        const remaining =
            Math.max(0, sessionExpiresAt - Date.now());
        const totalSeconds =
            Math.floor(remaining / 1000);
        const minutes =
            String(Math.floor(totalSeconds / 60))
                .padStart(2, '0');
        const seconds =
            String(totalSeconds % 60)
                .padStart(2, '0');
        document.getElementById(
            'sessionRemaining'
        ).textContent =
            `Session: ${minutes}:${seconds}`;
    }

    function startDashboard() {
        fetchVersion();
        updateSortUI();
        fetchTorrents();
        if (pollTimer) {
            clearInterval(pollTimer);
        }
        pollTimer = setInterval(
            fetchTorrents,
            refreshInterval
        );
        const dropdown = document.getElementById('refreshInterval');
        if (dropdown) {
            dropdown.value = String(refreshInterval);
        }
    }

    document.addEventListener('change', e => {
        if (e.target.id !== 'refreshInterval') {
            return;
        }
        refreshInterval = Number(e.target.value);
        localStorage.setItem(
            'refreshInterval',
            String(refreshInterval)
        );
        startDashboard();
        toast(
            `Refresh interval updated`,
            'success'
        );
    });

    function handleUnauth() {
        clearInterval(pollTimer);
        clearInterval(sessionCountdown);
        apikey = '';
        sessionStorage.removeItem('apikey');
        sessionStorage.removeItem('sessionExpiresAt');
        selectedNames.clear();
        showView('loginView');
        document.getElementById('loginError').textContent = 'Session expired. Please log in again.';
        document.getElementById('loginError').classList.add('visible');
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        clearInterval(pollTimer);
        clearInterval(sessionCountdown);
        apikey = '';
        sessionStorage.removeItem('apikey');
        sessionStorage.removeItem('sessionExpiresAt');
        selectedNames.clear();
        showView('loginView');
        toast('Logged out', 'success');
    });

    // ── Fetch version ─────────────────────────────────────────
    async function fetchVersion() {
        try {
            const resp = await fetch(
                '/version',
                {signal: AbortSignal.timeout(timeout)}
            );
            if (!resp.ok) {
                throw new Error('Failed to fetch version');
            }
            const data = await resp.json();
            document.getElementById('versionText').textContent =
                `v${data.version}`;
        } catch (err) {
            console.error(err);
            toast('Failed to fetch version', 'error');
            document.getElementById('versionText').textContent =
                'v?';
        }
    }

    function getPercent(str) {
        return parseInt(
            str.match(/\d+/)?.[0] || '0',
            10
        );
    }

    function statusWeight(status) {
        const s = status.toLowerCase();
        if (s === 'copyerror') return 0;
        if (s === 'failed') return 1;
        if (s.startsWith('downloading')) return 2 + getPercent(status) / 100;
        if (s === 'copying') return 4;
        if (s === 'downloaded') return 5;
        if (s === 'completed') return 6;
        return 3;
    }

    function sortEntries(entries) {
        return [...entries].sort((a, b) => {
            let result = 0;

            if (sortKey === 'name') {
                result = a[0].localeCompare(
                    b[0],
                    undefined,
                    {
                        numeric: true,
                        sensitivity: 'base'
                    }
                );
            } else if (sortKey === 'status') {
                result = statusWeight(a[1]) - statusWeight(b[1]);
            }

            return sortDirection === 'asc'
                ? result
                : -result;
        });
    }

    function updateSortUI() {
        document
            .querySelectorAll('.sortable')
            .forEach(el => {
                el.classList.remove(
                    'active',
                    'asc',
                    'desc'
                );
            });

        const active =
            sortKey === 'name'
                ? document.getElementById('sortName')
                : document.getElementById('sortStatus');

        active.classList.add(
            'active',
            sortDirection
        );
    }

    function setSort(key) {
        if (sortKey === key) {
            sortDirection =
                sortDirection === 'asc'
                    ? 'desc'
                    : 'asc';
        } else {
            sortKey = key;
            sortDirection = 'asc';
        }

        sessionStorage.setItem(
            'sortKey',
            sortKey
        );

        sessionStorage.setItem(
            'sortDirection',
            sortDirection
        );

        updateSortUI();
        fetchTorrents();
    }

    document
        .getElementById('sortName')
        .addEventListener('click', () => {
            setSort('name');
        });

    document
        .getElementById('sortStatus')
        .addEventListener('click', () => {
            setSort('status');
        });

    // ── Fetch torrents ─────────────────────────────────────────
    async function fetchTorrents() {
        try {
            const resp = await fetch('/torrent', {
                headers: authHeaders(),
                signal: AbortSignal.timeout(timeout)
            });

            if (resp.status === 401) {
                handleUnauth();
                return;
            }

            document.getElementById('lastUpdated').textContent =
                'Updated ' + new Date().toLocaleTimeString();

            const data = await resp.json();
            const rawData = Object.entries(data);
            const body = document.getElementById('torrentBody');

            if (rawData.length === 0) {
                document.getElementById('torrentCount').textContent = '(0)';
                document.getElementById('selectAll').checked = false;
                body.innerHTML = `
                <tr>
                    <td colspan="3" class="empty-state">
                        No active torrents
                    </td>
                </tr>
            `;

                selectedNames.clear();
                document.getElementById('deleteBtn').disabled = true;
                return;
            }

            const entries = sortEntries(rawData);
            document.getElementById('torrentCount').textContent = `(${entries.length})`;
            const validNames = new Set(entries.map(([n]) => n));
            selectedNames.forEach(name => {
                if (!validNames.has(name)) {
                    selectedNames.delete(name);
                }
            });

            body.innerHTML = entries.map(([name, status]) => `
            <tr class="${selectedNames.has(name) ? 'selected' : ''}" data-name="${esc(name)}">
                <td>
                    <input
                        class="torrent-check"
                        type="checkbox"
                        value="${esc(name)}"
                        ${selectedNames.has(name) ? 'checked' : ''}
                    >
                </td>
                <td>${esc(name)}</td>
                <td>${badge(status)}</td>
            </tr>
        `).join('');
            body.querySelectorAll('tr').forEach(row => {
                row.addEventListener('click', e => {
                    if (e.target.tagName !== 'INPUT') {
                        const cb = row.querySelector('input');
                        cb.checked = !cb.checked;
                    }
                    const cb = row.querySelector('input');
                    const name = row.dataset.name;
                    if (cb.checked) {
                        selectedNames.add(name);
                        row.classList.add('selected');
                    } else {
                        selectedNames.delete(name);
                        row.classList.remove('selected');
                    }
                    document.getElementById('deleteBtn').disabled =
                        selectedNames.size === 0;
                });
            });
            const selectAll = document.getElementById('selectAll');
            selectAll.checked =
                entries.length > 0 &&
                selectedNames.size === entries.length;
            selectAll.onclick = () => {
                const checked = selectAll.checked;
                body.querySelectorAll('tr').forEach(row => {
                    const cb = row.querySelector('input');
                    const name = row.dataset.name;
                    cb.checked = checked;
                    if (checked) {
                        selectedNames.add(name);
                        row.classList.add('selected');
                    } else {
                        selectedNames.delete(name);
                        row.classList.remove('selected');
                    }
                });
                document.getElementById('deleteBtn').disabled =
                    selectedNames.size === 0;
            };
            document.getElementById('deleteBtn').disabled =
                selectedNames.size === 0;
        } catch (err) {
            console.error(err);
            toast('Failed to fetch torrents', 'error');
        }
    }

    // ── Delete ─────────────────────────────────────────────────
    document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (selectedNames.size === 0) return;
        const totalRows = document.querySelectorAll('#torrentBody tr[data-name]').length;
        const deletingAll = selectedNames.size === totalRows;
        const confirmed = confirm(
            deletingAll
                ? `Delete ALL ${selectedNames.size} torrents?\n\nThis action cannot be undone.`
                : `Delete ${selectedNames.size} selected torrent(s)?`
        );
        if (!confirmed) {
            return;
        }
        const btn = document.getElementById('deleteBtn');
        btn.disabled = true;
        btn.textContent = 'Deleting…';
        const names = [...selectedNames];
        try {
            await Promise.all(
                names.map(async name => {
                    const resp = await fetch(
                        `/torrent?name=${encodeURIComponent(name)}`,
                        {
                            method: 'DELETE',
                            headers: authHeaders(),
                            signal: AbortSignal.timeout(timeout)
                        },
                    );
                    if (resp.status === 401) {
                        handleUnauth();
                        return;
                    }
                    if (!resp.ok) {
                        throw new Error(`${name}: ${await resp.text()}`);
                    }
                })
            );
            toast(`Deleted ${names.length} torrent(s)`, 'success');
            selectedNames.clear();
            await fetchTorrents();
        } catch (err) {
            toast(err.message || 'Delete failed', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Delete Selected';
        }
    });

    // ── Add Torrent Modal ──────────────────────────────────────
    document.getElementById('addBtn').addEventListener('click', () => document.getElementById('addModal').classList.add('open'));
    document.getElementById('closeModal').addEventListener('click', closeAdd);
    document.getElementById('cancelModal').addEventListener('click', closeAdd);
    document.getElementById('addModal').addEventListener('click', e => {
        if (e.target === document.getElementById('addModal')) closeAdd();
    });

    function closeAdd() {
        document.getElementById('addModal').classList.remove('open');
        ['f-url', 'f-save', 'f-host', 'f-user', 'f-path'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('f-delete').checked = false;
    }

    document.getElementById('submitAdd').addEventListener('click', async () => {
        const url = document.getElementById('f-url').value.trim();
        if (!url) {
            toast('Magnet URL is required', 'error');
            return;
        }

        const basePayload = {
            url,
            delete_after_copy: document.getElementById('f-delete').checked,
        };

        const savePath = document.getElementById('f-save').value.trim();
        const remoteHost = document.getElementById('f-host').value.trim();
        const remoteUsername = document.getElementById('f-user').value.trim();
        const remotePath = document.getElementById('f-path').value.trim();

        if (savePath) {
            basePayload.save_path = savePath;
        }
        if (remoteHost) {
            basePayload.remote_host = remoteHost;
        }
        if (remoteUsername) {
            basePayload.remote_username = remoteUsername;
        }
        if (remotePath) {
            basePayload.remote_path = remotePath;
        }
        const payload = [basePayload];

        const btn = document.getElementById('submitAdd');
        btn.disabled = true;
        btn.textContent = 'Queueing…';

        try {
            const resp = await fetch('/torrent', {
                method: 'PUT',
                headers: authHeaders(),
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(timeout)
            });
            if (resp.status === 401) {
                handleUnauth();
                return;
            }

            const data = await resp.json();
            const [name, status] = Object.entries(data[0])[0];

            if (status.startsWith('OK')) {
                toast(`Queued: ${name}`, 'success');
                closeAdd();
                await fetchTorrents();
            } else {
                toast(`${name}: ${status}`, 'error');
            }
        } catch {
            toast('Network error', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Queue Torrent →';
        }
    });

    // ── Helpers ───────────────────────────────────────────────
    function badge(status) {
        const s = status.toLowerCase();
        if (s.includes('→ copy queued'))
            return `<span class="badge badge-downloading">${esc(status)}</span>`;
        if (s.startsWith('downloading')) {
            return `<span class="badge badge-downloading">${esc(status)}</span>`;
        }
        if (s === 'copying')
            return `<span class="badge badge-copying">Copying</span>`;
        if (s === 'downloaded') return `
            <span class="badge badge-downloaded">Downloaded</span>
            <button class="retry-btn" title="Start Transfer" onclick="doRetry(this, event)"
                    style="border-color:rgba(192,132,252,0.4); color:#c084fc;">
                <span class="retry-icon">⧉</span>
            </button>`;
        if (s === 'completed')
            // MARK: Soon to be deleted status
            return `<span class="badge badge-completed">Completed</span>`;
        if (s === 'transferred') return `
            <span class="badge badge-completed">Transferred</span>
            <button class="retry-btn" title="Restart Rsync" onclick="doRetry(this, event)"
                    style="border-color:rgba(192,132,252,0.4); color:#c084fc;">
                <span class="retry-icon">⧉</span>
            </button>`;
        if (s === 'failed')
            return `<span class="badge badge-failed">Failed</span>`;
        if (s === 'copyerror') return `
            <span class="badge badge-copy-error">Copy Error</span>
            <button class="retry-btn" title="Retry Transfer" onclick="doRetry(this, event)">
                <span class="retry-icon">↻</span>
            </button>`;
        return `<span class="badge">${esc(status)}</span>`;
    }

    // ── Retry Modal ───────────────────────────────────────────
    let _retryBtn = null;

    function doRetry(btn, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        const name = btn.closest('tr').dataset.name;
        _retryBtn = btn;
        document.getElementById('r-name').value = name;
        document.getElementById('r-host').value = '';
        document.getElementById('r-user').value = '';
        document.getElementById('r-path').value = '';
        document.getElementById('r-timeout').value = '';
        document.getElementById('r-delete').checked = false;
        document.getElementById('retry-modal-title').innerHTML = btn.title;
        document.getElementById('retryModal').classList.add('open');
    }

    function closeRetry() {
        document.getElementById('retryModal').classList.remove('open');
        _retryBtn = null;
    }

    document.getElementById('closeRetryModal').addEventListener('click', closeRetry);
    document.getElementById('cancelRetryModal').addEventListener('click', closeRetry);
    document.getElementById('retryModal').addEventListener('click', e => {
        if (e.target === document.getElementById('retryModal')) closeRetry();
    });

    document.getElementById('submitRetry').addEventListener('click', async () => {
        const name = document.getElementById('r-name').value;
        const btn = document.getElementById('submitRetry');
        btn.disabled = true;
        btn.textContent = 'Retrying…';
        if (_retryBtn) {
            _retryBtn.classList.add('spinning');
            _retryBtn.disabled = true;
        }

        const rHost = document.getElementById('r-host');
        const rUser = document.getElementById('r-user');
        const rPath = document.getElementById('r-path');
        const rTimeout = document.getElementById('r-timeout');
        const rDelete = document.getElementById('r-delete');

        const payload = {
            name,
            remote_host: rHost ? rHost.value.trim() : '',
            remote_username: rUser ? rUser.value.trim() : '',
            remote_path: rPath ? rPath.value.trim() : '',
            rsync_timeout: rTimeout ? parseInt(rTimeout.value.trim(), 10) || 0 : 0, // provide default
            delete_after_copy: rDelete ? rDelete.checked : false, // provide default
        };

        try {
            const resp = await fetch('/retry', {
                method: 'POST',
                headers: authHeaders(),
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(timeout)
            });
            if (resp.status === 401) {
                handleUnauth();
                return;
            }
            if (resp.ok) {
                toast(`Retry queued: ${name}`, 'success');
                closeRetry();
                await fetchTorrents();
            } else {
                toast(`Retry failed: ${await resp.text()}`, 'error');
            }
        } catch {
            toast('Network error', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Retry →';
            if (_retryBtn) {
                _retryBtn.classList.remove('spinning');
                _retryBtn.disabled = false;
            }
        }
    });

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        document.getElementById('toastArea').appendChild(el);
        setTimeout(() => el.remove(), 10000);
    }
</script>
</body>
</html>

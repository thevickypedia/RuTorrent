[package]
name = "rutorrent"
version = "1.1.0"
description = "RuTorrent is a lightweight API (with an optional WebUI) that can download magnet links and asynchronously transfer files to a remote server over SSH via rsync. The API also has an explore feature protected with tor proxy; and automatic VPN detection using mullvad cli."
license = "MIT"
documentation = "https://docs.rs/rutorrent"
homepage = "https://github.com/thevickypedia/rutorrent"
repository = "https://github.com/thevickypedia/rutorrent"
rust-version = "1.95.0"
keywords = ["rutorrent", "qbittorrent", "asynchronous-server"]
categories = ["web-programming::http-server", "asynchronous"]
include = ["/src", "LICENSE"]
edition = "2024"
authors = ["Vignesh Rao"]

[lib]
name = "rutorrent"
path = "src/lib.rs"

[[bin]]
name = "rutorrent"
path = "src/main.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]

[dependencies]
utoipa = { version = "6.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "10.0", features = ["actix-web", "vendored"] }
actix-web = "4.17"
reqwest = { version = "0.13", features = ["cookies", "json", "form", "query", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-rt = "2.15"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
env_logger = "0.11"
chrono = "0.4"
log = "0.4"
uuid = { version = "1.28", features = ["v4"] }
dotenv = "0.15"
url = "2.5"
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "7.0"
base64 = "0.23"
urlencoding = "2.1"
rand = "0.10"
